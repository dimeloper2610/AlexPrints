<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Works — AlexPrints</title>
<meta name="description" content="Hand-pulled etchings, linocuts, woodcuts and paintings by Alex. Small editions, signed and numbered.">
<meta name="theme-color" content="#f3efe6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23f3efe6'/><rect x='7' y='6' width='18' height='20' fill='none' stroke='%231b1a17' stroke-width='1.5'/><rect x='11' y='10' width='10' height='9' fill='%23b0372a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="works">
<main>
  <div class="page-head">
    <div class="wrap">
      <span class="eyebrow">Shop</span>
      <h1 id="works-title">All works</h1>
      <p class="lede" id="works-lede"></p>
    </div>
  </div>
  <div class="filters">
    <div class="wrap">
      <div class="chips" id="cat-chips" role="group" aria-label="Category"></div>
      <div class="filter-right">
        <label class="toggle"><input type="checkbox" id="avail"> Available only</label>
        <label class="sr-only" for="sort">Sort</label>
        <select class="select" id="sort">
          <option value="newest">Newest</option>
          <option value="price-asc">Price, low to high</option>
          <option value="price-desc">Price, high to low</option>
          <option value="size">Largest first</option>
        </select>
        <span class="result-count mono" id="result-count"></span>
      </div>
    </div>
    <div class="wrap" style="padding-top:0"><div class="chips" id="tech-chips" role="group" aria-label="Technique"></div></div>
  </div>
  <div class="wrap">
    <p class="technique-note" id="technique-note"></p>
    <div class="grid" id="grid"></div>
  </div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
