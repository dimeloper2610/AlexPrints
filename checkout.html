<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order request — AlexPrints</title>
<meta name="description" content="Hand-pulled etchings, linocuts, woodcuts and paintings by Alex. Small editions, signed and numbered.">
<meta name="theme-color" content="#f3efe6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23f3efe6'/><rect x='7' y='6' width='18' height='20' fill='none' stroke='%231b1a17' stroke-width='1.5'/><rect x='11' y='10' width='10' height='9' fill='%23b0372a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="checkout">
<main>
  <div class="page-head">
    <div class="wrap">
      <span class="eyebrow">Order request</span>
      <h1>Nearly there</h1>
      <p class="lede">Send your selection and shipping address. Alex will confirm availability, add the shipping cost and reply with a secure payment link. Nothing is charged now.</p>
    </div>
  </div>
  <div class="wrap checkout-grid" style="padding-bottom:80px">
    <form class="form" id="order-form">
      <div class="row">
        <div class="field"><label for="o-name">Full name</label><input id="o-name" name="name" required autocomplete="name"></div>
        <div class="field"><label for="o-email">Email</label><input id="o-email" name="email" type="email" required autocomplete="email"></div>
      </div>
      <div class="field"><label for="o-phone">Phone (optional)</label><input id="o-phone" name="phone" type="tel" autocomplete="tel"></div>
      <div class="field"><label for="o-address">Address</label><input id="o-address" name="address" required autocomplete="street-address"></div>
      <div class="row">
        <div class="field"><label for="o-city">City</label><input id="o-city" name="city" required autocomplete="address-level2"></div>
        <div class="field"><label for="o-post">Postcode</label><input id="o-post" name="postcode" required autocomplete="postal-code"></div>
      </div>
      <div class="field"><label for="o-country">Country</label><input id="o-country" name="country" required autocomplete="country-name"></div>
      <div class="field"><label for="o-notes">Notes (optional)</label><textarea id="o-notes" name="notes" placeholder="A dedication, a delivery date, questions about framing..."></textarea></div>
      <div><button class="btn" type="submit">Send order request</button></div>
      <div class="form-status" id="order-status" role="status"></div>
    </form>
    <aside class="summary" id="summary"></aside>
  </div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
